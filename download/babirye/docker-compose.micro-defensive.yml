services:
  zt-gateway-micro_defensive:
    image: alpine:latest
    container_name: babirye-zt-gateway-micro_defensive
    restart: "no"
    networks:
      - micro-defensive-net
    command: >
      sh -c "
        apk add --no-cache python3 py3-pip curl bash jq && pip3 install fastapi uvicorn pydantic &&
        cat > /app/gateway.py << 'GWEOF'
        import os, hmac, hashlib, time, json, subprocess
        from fastapi import FastAPI, HTTPException; from pydantic import BaseModel; import uvicorn
        SECRET = os.getenv('MICRO_DEFENSIVE_SECRET', 'CHANGE_ME'); PASSWORD = os.getenv('MICRO_DEFENSIVE_PASSWORD', 'CHANGE_ME')
        ACTIVE = False; DEPLOYED = []; app = FastAPI()
        class SPAPacket(BaseModel):
            timestamp: int; nonce: str; signature: str; action: str; service: str = None; params: dict = {}
        def verify_spa(p):
            if abs(time.time() - p.timestamp) > 300: return False
            msg = f'{p.timestamp}:{p.nonce}:{p.action}:{p.service or ""}:{json.dumps(p.params, separators=(",",":"), sort_keys=True)}'
            expected = hmac.new(SECRET.encode(), msg.encode(), hashlib.sha256).hexdigest()
            return hmac.compare_digest(expected, p.signature)
        @app.post('/spa/activate')
        async def activate(p: SPAPacket):
            global ACTIVE
            if not verify_spa(p): raise HTTPException(401, 'Invalid SPA')
            ACTIVE = True; return {'status': 'activated'}
        @app.post('/spa/deactivate')
        async def deactivate(p: SPAPacket):
            global ACTIVE, DEPLOYED
            if not verify_spa(p): raise HTTPException(401, 'Invalid SPA')
            ACTIVE = False
            for s in DEPLOYED:
                subprocess.run(['docker','compose','-f','/app/docker-compose.micro-defensive.yml','--profile','micro_defensive','stop',s])
                subprocess.run(['docker','compose','-f','/app/docker-compose.micro-defensive.yml','--profile','micro_defensive','rm','-f',s])
            DEPLOYED = []; return {'status': 'deactivated'}
        @app.post('/spa/deploy')
        async def deploy(p: SPAPacket):
            if not verify_spa(p): raise HTTPException(401, 'Invalid SPA')
            if not ACTIVE: raise HTTPException(403, 'micro_defensive arsenal dormant')
            if not p.service: raise HTTPException(400, 'Service required')
            result = subprocess.run(['docker','compose','-f','/app/docker-compose.micro-defensive.yml','--profile','micro_defensive','up','-d',p.service], capture_output=True)
            if result.returncode == 0: DEPLOYED.append(p.service); return {'status':'deployed','service':p.service}
            return {'status':'failed','error':result.stderr}
        @app.get('/spa/status')
        async def status(): return {'active': ACTIVE, 'deployed': DEPLOYED}
        @app.get('/spa/services')
        async def services(): return {'services': ["html-sanitizer","sql-sanitizer","xss-filter","cmd-injection-guard","path-traversal-guard","ldap-injection-guard","xml-sanitizer","header-injection-guard","crlf-injection-guard","ssti-guard","jwt-validator","csp-enforcer","cors-guard","rate-limiter","brute-force-guard","csrf-guard","idempotency-guard","payload-size-guard","schema-validator","regex-validator","file-hash-monitor","config-drift-detector","process-monitor","network-flow-monitor","dns-monitor","certificate-monitor","user-activity-monitor","priv-esc-monitor","login-anomaly-detector","file-access-monitor","registry-monitor","service-monitor","port-monitor","cron-monitor","kernel-module-monitor","docker-event-monitor","api-call-auditor","session-monitor","resource-quota-guard","temp-file-cleaner","key-rotator","tls-config-checker","secret-scanner","env-validator","password-policy-enforcer","token-revoker","cert-pinner","hmac-timestamp-guard","nonce-tracker","encryption-at-rest-check","key-derivation-checker","randomness-quality-checker","hash-algorithm-checker","pem-parser","ocsp-responder","crl-checker","key-usage-enforcer","vault-health-check","crypto-benchmark","seed-phrase-validator","port-scan-detector","syn-flood-guard","arp-spoof-detector","dns-hijack-guard","rogue-ap-detector","mac-flood-guard","vlan-hopping-guard","icmp-tunnel-detector","dns-tunnel-detector","http-tunnel-detector","ssh-brute-guard","rdp-guard","smb-guard","ftp-guard","smtp-guard","ip-reputation-checker","geoip-guard","tor-exit-guard","vpn-detector","bot-detection","container-escape-guard","privileged-container-detector","image-vuln-scanner-micro","secret-in-image-scanner","network-policy-validator","rbac-auditor","pod-security-checker","service-account-auditor","ingress-scanner","configmap-secret-checker","cloudtrail-monitor","s3-bucket-scanner","iam-auditor","sg-auditor","vpc-flow-analyzer","ec2-metadata-guard","lambda-permission-checker","secrets-manager-auditor","kms-key-rotator","cloud-config-auditor","self-injection-guard","self-exfiltration-guard","self-privilege-guard","self-modification-guard","self-comm-guard","self-dos-guard","self-resource-guard","self-memory-guard","self-config-guard","self-credential-guard","self-deserialization-guard","self-path-guard","self-race-guard","self-timebomb-guard","self-backdoor-guard","self-crypto-guard","self-log-guard","self-depconfusion-guard","self-prototype-guard","self-replay-guard","self-supply-chain-guard","self-encoding-bypass-guard","self-unicode-bypass-guard","self-model-extraction-guard","self-adversarial-guard","behavioral-baseline","anomaly-scoring-engine","threat-intel-enricher","ioc-matcher","yara-rules-engine","sigma-rules-engine","mitre-mapping-engine","kill-chain-analyzer","diamond-model-analyzer","attack-graph-generator","risk-scoring-engine","vuln-prioritizer","patch-priority-engine","compliance-checker","incident-timer","evidence-chain-validator","timeline-reconstructor","malware-triage","phishing-detector","deepfake-detector","social-eng-guard","insider-threat-detector","data-exfil-detector","lateral-movement-detector","persistence-detector"]}
        if __name__ == '__main__': uvicorn.run(app, host='0.0.0.0', port=4750)
        GWEOF
        python3 /app/gateway.py
      "
    environment:
      - MICRO_DEFENSIVE_SECRET=${MICRO_DEFENSIVE_SECRET:-CHANGE_ME}
      - MICRO_DEFENSIVE_PASSWORD=${MICRO_DEFENSIVE_PASSWORD:-CHANGE_ME}
    ports:
      - "4750:4750"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./docker-compose.micro-defensive.yml:/app/docker-compose.micro-defensive.yml
