        class SensorCommand(BaseModel):
            sensor_type: str
            mode: str
            params: dict = {}

        class WeaponCommand(BaseModel):
            weapon: str
            target: str
            fire: bool = False

        @app.post('/sensors/radar')
        async def radar(cmd: SensorCommand):
            if cmd.sensor_type not in RADAR_TYPES:
                return {'error': 'Unknown radar type'}
            return {'status': 'radar_active', 'type': cmd.sensor_type, 'mode': cmd.mode,
                    'data': {'contacts': random.randint(0, 20), 'range': random.randint(1, 100), 'bearing': random.randint(0, 360)}}

        @app.post('/sensors/sonar')
        async def sonar(cmd: SensorCommand):
            if cmd.sensor_type not in SONAR_TYPES:
                return {'error': 'Unknown sonar type'}
            return {'status': 'sonar_active', 'type': cmd.sensor_type, 'mode': cmd.mode,
                    'data': {'contacts': random.randint(0, 10), 'depth': random.randint(1, 1000), 'bearing': random.randint(0, 360)}}

        @app.post('/sensors/lidar')
        async def lidar(cmd: SensorCommand):
            if cmd.sensor_type not in LIDAR_TYPES:
                return {'error': 'Unknown LiDAR type'}
            return {'status': 'lidar_active', 'type': cmd.sensor_type, 'mode': cmd.mode,
                    'data': {'points': random.randint(1000, 100000), 'range': random.randint(1, 2000), 'resolution': round(random.uniform(0.01, 1), 3)}}

        @app.post('/sensors/acoustic')
        async def acoustic(cmd: SensorCommand):
            if cmd.sensor_type not in ACOUSTIC_TYPES:
                return {'error': 'Unknown acoustic type'}
            return {'status': 'acoustic_active', 'type': cmd.sensor_type, 'mode': cmd.mode,
                    'data': {'detections': random.randint(0, 5), 'confidence': round(random.uniform(0.7, 0.99), 2), 'range': random.randint(1, 500)}}

        @app.post('/sensors/ew')
        async def ew(cmd: SensorCommand):
            if cmd.sensor_type not in EW_TYPES:
                return {'error': 'Unknown EW type'}
            return {'status': 'ew_active', 'type': cmd.sensor_type, 'mode': cmd.mode,
                    'data': {'targets_affected': random.randint(0, 10), 'effective_range': random.randint(1, 100)}}

        @app.post('/weapons/fire')
        async def fire_weapon(cmd: WeaponCommand):
            if cmd.weapon not in WEAPONS:
                return {'error': 'Unknown weapon'}
            weapon = WEAPONS[cmd.weapon]
            if cmd.fire:
                return {'status': 'fired', 'weapon': cmd.weapon, 'target': cmd.target, 'specs': weapon, 'timestamp': 'now'}
            return {'status': 'armed', 'weapon': cmd.weapon, 'specs': weapon}

        @app.get('/weapons')
        async def list_weapons():
            return {'weapons': list(WEAPONS.keys())}

        @app.get('/weapons/{weapon}')
        async def get_weapon(weapon: str):
            if weapon not in WEAPONS:
                return {'error': 'Weapon not found'}
            return WEAPONS[weapon]

        @app.get('/martial_arts')
        async def list_martial_arts():
            return {'styles': list(MARTIAL_ARTS.keys())}

        @app.get('/martial_arts/{style}')
        async def get_martial_art(style: str):
            if style not in MARTIAL_ARTS:
                return {'error': 'Style not found'}
            return MARTIAL_ARTS[style]

        @app.get('/sensors/radar/types')
        async def list_radar():
            return {'types': list(RADAR_TYPES.keys())}

        @app.get('/sensors/sonar/types')
        async def list_sonar():
