services:
  zt-gateway-defensive:
    image: alpine:latest
    container_name: babirye-zt-gateway-defensive
    restart: "no"
    networks:
      - defensive-net
    command: >
      sh -c "
        apk add --no-cache python3 py3-pip curl bash jq && pip3 install fastapi uvicorn pydantic &&
        cat > /app/gateway.py << 'GWEOF'
        import os, hmac, hashlib, time, json, subprocess
        from fastapi import FastAPI, HTTPException; from pydantic import BaseModel; import uvicorn
        SECRET = os.getenv('DEFENSIVE_SECRET', 'CHANGE_ME'); PASSWORD = os.getenv('DEFENSIVE_PASSWORD', 'CHANGE_ME')
        ACTIVE = False; DEPLOYED = []; app = FastAPI()
        class SPAPacket(BaseModel):
            timestamp: int; nonce: str; signature: str; action: str; service: str = None; params: dict = {}
        def verify_spa(p):
            if abs(time.time() - p.timestamp) > 300: return False
            msg = f'{p.timestamp}:{p.nonce}:{p.action}:{p.service or ""}:{json.dumps(p.params, separators=(",",":"), sort_keys=True)}'
            expected = hmac.new(SECRET.encode(), msg.encode(), hashlib.sha256).hexdigest()
            return hmac.compare_digest(expected, p.signature)
        @app.post('/spa/activate')
        async def activate(p: SPAPacket):
            global ACTIVE
            if not verify_spa(p): raise HTTPException(401, 'Invalid SPA')
            ACTIVE = True; return {'status': 'activated'}
        @app.post('/spa/deactivate')
        async def deactivate(p: SPAPacket):
            global ACTIVE, DEPLOYED
            if not verify_spa(p): raise HTTPException(401, 'Invalid SPA')
            ACTIVE = False
            for s in DEPLOYED:
                subprocess.run(['docker','compose','-f','/app/docker-compose.defensive.yml','--profile','defensive','stop',s])
                subprocess.run(['docker','compose','-f','/app/docker-compose.defensive.yml','--profile','defensive','rm','-f',s])
            DEPLOYED = []; return {'status': 'deactivated'}
        @app.post('/spa/deploy')
        async def deploy(p: SPAPacket):
            if not verify_spa(p): raise HTTPException(401, 'Invalid SPA')
            if not ACTIVE: raise HTTPException(403, 'defensive arsenal dormant')
            if not p.service: raise HTTPException(400, 'Service required')
            result = subprocess.run(['docker','compose','-f','/app/docker-compose.defensive.yml','--profile','defensive','up','-d',p.service], capture_output=True)
            if result.returncode == 0: DEPLOYED.append(p.service); return {'status':'deployed','service':p.service}
            return {'status':'failed','error':result.stderr}
        @app.get('/spa/status')
        async def status(): return {'active': ACTIVE, 'deployed': DEPLOYED}
        @app.get('/spa/services')
        async def services(): return {'services': ["snort","suricata","zeek","wazuh-server","ossec-server","fail2ban","crowdsec","securityonion","moloch","arkime","sagan","greenbone","openvas-scanner","ntopng","velociraptor","graylog","elk-stack","splunk-free","alerta","canarytokens","honeytrap","cowrie","dionaea","clamav","rkhunter","chkrootkit","lynis","osquery","sysmon","falco","auditd","aide","tripwire","samhain","yara","sigma","stix-validator","mitre-attack","opencti","misp","crits","vulnwhisperer","wazuh-agent","ossec-agent","grr","osdvm","modsecurity","coraza-waf","openresty","oauth2-proxy","keycloak","dex-idp","pomerium","traefik","envoy","vault","consul-template","cert-manager","step-ca","spire","opa","kyverno","trivy","checkov","tfsec","kubesec","kube-bench","kube-hunter","dockle","clair","grype","duo-auth","privacyidea","authelia","kanidm","lldap","fusionauth","authentik","supertokens","logto","minio","restic","borgbackup","sops","age-encryption","gpg","wireguard","tailscale","nebula","headscale","firezone","cloudflared","pihole","adguard-home","def-extra-95","def-extra-96","def-extra-97","def-extra-98","def-extra-99","def-extra-100"]}
        if __name__ == '__main__': uvicorn.run(app, host='0.0.0.0', port=4749)
        GWEOF
        python3 /app/gateway.py
      "
    environment:
      - DEFENSIVE_SECRET=${DEFENSIVE_SECRET:-CHANGE_ME}
      - DEFENSIVE_PASSWORD=${DEFENSIVE_PASSWORD:-CHANGE_ME}
    ports:
      - "4749:4749"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./docker-compose.defensive.yml:/app/docker-compose.defensive.yml
    deploy:
      replicas: 0
    profiles:
      - defensive
    cap_add:
      - NET_ADMIN
    networks:
      - defensive-net

