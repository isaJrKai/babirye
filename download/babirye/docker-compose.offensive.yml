services:
  zt-gateway-offensive:
    image: alpine:latest
    container_name: babirye-zt-gateway-offensive
    restart: "no"
    networks:
      - offensive-net
    command: >
      sh -c "
        apk add --no-cache python3 py3-pip curl bash jq && pip3 install fastapi uvicorn pydantic &&
        cat > /app/gateway.py << 'GWEOF'
        import os, hmac, hashlib, time, json, subprocess
        from fastapi import FastAPI, HTTPException; from pydantic import BaseModel; import uvicorn
        SECRET = os.getenv('OFFENSIVE_SECRET', 'CHANGE_ME'); PASSWORD = os.getenv('OFFENSIVE_PASSWORD', 'CHANGE_ME')
        ACTIVE = False; DEPLOYED = []; app = FastAPI()
        class SPAPacket(BaseModel):
            timestamp: int; nonce: str; signature: str; action: str; service: str = None; params: dict = {}
        def verify_spa(p):
            if abs(time.time() - p.timestamp) > 300: return False
            msg = f'{p.timestamp}:{p.nonce}:{p.action}:{p.service or ""}:{json.dumps(p.params, separators=(",",":"), sort_keys=True)}'
            expected = hmac.new(SECRET.encode(), msg.encode(), hashlib.sha256).hexdigest()
            return hmac.compare_digest(expected, p.signature)
        @app.post('/spa/activate')
        async def activate(p: SPAPacket):
            global ACTIVE
            if not verify_spa(p): raise HTTPException(401, 'Invalid SPA')
            ACTIVE = True; return {'status': 'activated'}
        @app.post('/spa/deactivate')
        async def deactivate(p: SPAPacket):
            global ACTIVE, DEPLOYED
            if not verify_spa(p): raise HTTPException(401, 'Invalid SPA')
            ACTIVE = False
            for s in DEPLOYED:
                subprocess.run(['docker','compose','-f','/app/docker-compose.offensive.yml','--profile','offensive','stop',s])
                subprocess.run(['docker','compose','-f','/app/docker-compose.offensive.yml','--profile','offensive','rm','-f',s])
            DEPLOYED = []; return {'status': 'deactivated'}
        @app.post('/spa/deploy')
        async def deploy(p: SPAPacket):
            if not verify_spa(p): raise HTTPException(401, 'Invalid SPA')
            if not ACTIVE: raise HTTPException(403, 'offensive arsenal dormant')
            if not p.service: raise HTTPException(400, 'Service required')
            result = subprocess.run(['docker','compose','-f','/app/docker-compose.offensive.yml','--profile','offensive','up','-d',p.service], capture_output=True)
            if result.returncode == 0: DEPLOYED.append(p.service); return {'status':'deployed','service':p.service}
            return {'status':'failed','error':result.stderr}
        @app.get('/spa/status')
        async def status(): return {'active': ACTIVE, 'deployed': DEPLOYED}
        @app.get('/spa/services')
        async def services(): return {'services': ["redamon","pentestai","empire","sliver","covenant","mythic","freeze","shhhloader","donut","pezor","scarecrow","crimson-wisp","cable","powersploit","offsec-tools","autopentest","legion","redpi","zer0dayslater","chimera-c2","agent-p2p","ghosthid","metasploit","nmap","nikto","sqlmap","hydra","john","aircrack-ng","wifite","responder","mimikatz","bloodhound","crackmapexec","ligolo-ng","chisel","dnscat2","nishang","inveigh","bettercap","ettercap","tshark","impacket","rubeus","gobuster","feroxbuster","wfuzz","arjun","subfinder","amass","httpx-toolkit","nuclei","auto-recon","linpeas","winpeas","linux-exploit-suggester","keeppwn","laudanum","phpsploit","commix","xsstrike","tplmap","whatweb","wpscan","joomscan","droopescan","recon-ng","spiderfoot","theharvester","maltego","fierce","off-extra-50"]}
        if __name__ == '__main__': uvicorn.run(app, host='0.0.0.0', port=4747)
        GWEOF
        python3 /app/gateway.py
      "
    environment:
      - OFFENSIVE_SECRET=${OFFENSIVE_SECRET:-CHANGE_ME}
      - OFFENSIVE_PASSWORD=${OFFENSIVE_PASSWORD:-CHANGE_ME}
    ports:
      - "4747:4747"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./docker-compose.offensive.yml:/app/docker-compose.offensive.yml
    deploy:
      replicas: 0
    profiles:
      - offensive
    cap_add:
      - NET_ADMIN
    networks:
      - offensive-net

